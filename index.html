<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treats Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Unbounded:wght@800&display=block" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    .hub {
      display: flex;
      height: 100dvh;
    }

    .panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: flex 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .panel::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .panel--kindly  { background: #00778E; }
    .panel--treats  { background: #13201C; }
    .panel--perks   { background: #fbf4e6; }

    .panel--kindly::after  { background: rgba(255,255,255,0.08); }
    .panel--treats::after  { background: rgba(255,255,255,0.06); }
    .panel--perks::after   { background: rgba(0,0,0,0.06); }

    .panel:hover { flex: 1.35; }
    .panel:hover::after { opacity: 1; }

    .panel__logo {
      position: relative;
      z-index: 1;
      width: clamp(140px, 18vw, 260px);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .panel:hover .panel__logo {
      transform: scale(1.05);
    }

    /* Inline SVG sizing */
    .panel__logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Perks logo — HTML/CSS text with em-based dot */
    .panel--perks .panel__logo {
      width: auto;
    }
    .perks-logo {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 0.82;
      font-feature-settings: "ss01";
      color: #1f1a14;
      display: inline-flex;
      align-items: flex-end;
      white-space: nowrap;
      font-size: clamp(52px, 5.5vw, 82px);
    }
    .perks-logo .dot {
      width: 0.2em;
      height: 0.2em;
      border-radius: 50%;
      background: #f26a4f;
      margin-left: 0.035em;
      margin-bottom: 0.06em;
      flex: none;
    }

    /* Dividers */
    .panel + .panel {
      border-left: 1px solid rgba(255,255,255,0.12);
    }
    .panel--perks {
      border-left: 1px solid rgba(0,0,0,0.1) !important;
    }

    /* Mobile: stack vertically */
    @media (max-width: 767px) {
      html, body { overflow: auto; }

      .hub {
        flex-direction: column;
        height: auto;
        min-height: 100dvh;
      }

      .panel {
        flex: none;
        height: 33.33dvh;
        min-height: 200px;
        transition: none;
      }

      .panel:hover { flex: none; }

      .panel + .panel {
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.12);
      }
      .panel--perks {
        border-left: none !important;
        border-top: 1px solid rgba(0,0,0,0.1) !important;
      }

      .panel__logo {
        width: clamp(120px, 40vw, 220px);
      }
    }
  </style>
</head>

      </div>
    </a>

    <!-- TREATS -->
    <a class="panel panel--treats" href="treats-brand-guidelines/" aria-label="Treats brand guidelines">
      <div class="panel__logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479 116" role="img" aria-label="treats">
          <g transform="translate(8 8.0)">
            <g transform="rotate(-26 20 41)"><rect x="12" y="20" width="16" height="42" rx="8" fill="#1FA463"/></g>
            <g transform="rotate(20 64 33)"><rect x="56" y="12" width="16" height="42" rx="8" fill="#3A5A78"/></g>
